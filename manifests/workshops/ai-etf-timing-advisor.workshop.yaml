  creationReport:
    title: 人工智能ETF择时研究员车间声明
    body: |
      创建一个专门研究 515980 华富中证人工智能产业 ETF 的全仓择时研究车间。
      被控对象不是交易账户，而是 ETF 全仓买入/全仓卖出的决策支持状态：主要持仓结构、买入触发线、卖出触发线、趋势判断、风险边界和复盘反馈。
      观测输入包括 515980 主要持仓、权重股行情与趋势、515980 行情、市场温度、AI 主题新闻、资金信号和车间记忆。
      控制动作仅包括写入 advisory 计划、写车间事件、写车间记忆和输出人工决策建议。
      禁止模拟盘下单、撤单、真实券商连接、真实下单、自选股维护和对外发送交易指令。
      已配置盘前择时计划、盘中择时巡检、盘后持仓结构复盘三个闭环。
    requiredEvents:
      - 人工智能ETF择时研究员车间已创建
      - 515980 全仓择时 advisory 闭环已配置
    requiredFields:
      - holdingSource
      - mainHoldings
      - holdingBasketState
      - marketState
      - etfState
      - advisoryDecision
      - triggerPlan
      - invalidation
      - nextCheck
