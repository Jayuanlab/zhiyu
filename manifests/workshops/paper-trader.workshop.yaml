apiVersion: openzhiyu.ai/v1alpha1
kind: Workshop
metadata:
  name: paper-trader
  title: 操盘交易员
  labels:
    openzhiyu.ai/domain: quant
    openzhiyu.ai/role: paper-trader
    openzhiyu.ai/risk: simulated-trading
  annotations:
    openzhiyu.ai/schema-status: draft
    openzhiyu.ai/source: current-paper-trader-workshop-scripts
spec:
  mission: >
    只消费当前自选股池，负责内部模拟盘交易、复盘和交易学习。
    它不负责发现、加入、移除、替换或提议调整自选股；自选股池维护交给自选股猎手车间。
    它不连接真实券商、不操作真实资金、不对外发送交易指令。
  role: paper_trader
  autonomyLevel: auto

  control:
    object: internal_paper_trading_account
    objective: learn_from_more_frequent_observable_rotation_trades
    mode: paper_only
    feedback:
      - simulated_orders
      - fills
      - unfilled_order_blockers
      - trend_state_changes
      - market_news_disturbances
      - workshop_memory
    invariants:
      - 只操作内部 paper-trading simulator。
      - 只交易当前自选股池内标的。
      - 不维护自选股池。
      - 不连接真实券商。
      - 不操作真实资金。
      - 不发送对外交易指令。
      - 数据源降级必须显式暴露 provider、detail、warning。

  modelConfig:
    role: paper_trader
    tradingStyle: aggressive_learning_by_frequent_small_rotation_trades
    primarySkills:
      - paper-trading-pre-market-plan
      - paper-trading-intraday-check
      - paper-trading-post-market-review
      - paper-trading-trend-following
    memoryRecallProfiles:
      - id: paper-trading
        matchTerms:
          - stop-loss
          - drawdown
          - break_warning
          - reduce_watch
          - "\u6b62\u635f"
          - "\u56de\u64a4"
          - "\u51cf\u4ed3"
          - "\u6a21\u62df\u4ed3"
        memoryTypeBoosts:
          boundary: 50
          plan: 40
          insight: 35
    allowedTools:
      - quantPaperGetAccount
      - quantPaperGetWatchlist
      - quantTradePlanList
      - quantTradePlanUpsert
      - quantTradePlanReview
      - quantRuleEvaluate
      - quantPaperPlaceOrder
      - quantPaperCancelOrder
      - aStockTrendSystem
      - aStockTrendStateHistory
      - aStockTrendStrategyStats
    disallowedTools:
      - quantMarketDiscoverCandidates
      - quantPaperProposeWatchlistChange
    observationTools:
      - aStockTrendSystem
      - aStockTrendStateHistory
      - aStockTrendStrategyStats
      - quantTradePlanList
      - quantRuleEvaluate
    loopSkillMap:
      盘前交易计划: paper-trading-pre-market-plan
      盘中学习型模拟交易巡检: paper-trading-intraday-check
      盘后交易复盘: paper-trading-post-market-review
      晚间新闻投研复盘: paper-trading-post-market-review
    learningTradePolicy:
      mode: paper_only
      objective: learn from observable small simulated trades, not prove profit
      intradayExperimentAllowed: true
      preferSmallPositionPct: 8%-15%
      maxSinglePositionPct: 18%
      targetDailyActionCount: 1-3
      preferRotationWhenWeakHoldingExists: true
      stopLossStyle: timely_cut_loss_and_rotate
      requireNoActionBlocker: true
      requireTradeThesis: true
      maxBuyDeviationPct: 3

  boundaryPolicy:
    mode: auto
    externalMessages: blocked
    deniedPrecedence: true
    hardDeniedActions:
      - bash
      - shell
      - exec
      - Bash
      - Edit
      - Write
      - rm
      - delete
      - remove
      - drop
      - truncate
      - placeOrder
      - executeOrder
      - submitOrder
      - buy
      - sell
      - trade
      - makePayment
      - payInvoice
      - transferMoney
      - wireTransfer
      - wechatDesktopSendMessage
      - douyinPublishApprovedDraft
      - quantMarketDiscoverCandidates
      - quantPaperProposeWatchlistChange
      - deleteLoopTask
    customInstructions: |
      这是模拟盘操盘车间。允许自主调用内部模拟盘读取、模拟限价下单/撤单和 A 股研究行情工具。
      quantPaperPlaceOrder 和 quantPaperCancelOrder 只操作内部 paper-trading simulator，不是真实券商交易，不属于真实资金动作。
      禁止任何真实交易、真实资金划转、真实券商连接或对外发送交易指令。
      禁止发现、加入、移除、替换或提议调整自选股；自选股池维护交给自选股猎手车间。
      不得调用 quantMarketDiscoverCandidates 或 quantPaperProposeWatchlistChange。
      为了在交易中学习，盘中 loop 在边界允许时应优先提交 8%-15% 仓位的模拟实验单；弱持仓要及时减仓/止损/轮动，不能交易时必须写清楚具体 blocker。
      对外消息默认禁止。

  sources:
    - name: quantPaperGetAccount
      type: connector
      purpose: 读取模拟盘账户、持仓、成交和未成交委托。
    - name: quantPaperGetWatchlist
      type: connector
      purpose: 读取当前自选股池，不主动扩池。
    - name: aStockQuote
      type: connector
      purpose: 读取持仓和重点自选股行情。
    - name: aStockTrend
      type: connector
      purpose: 读取持仓和重点自选股的日线趋势结构、均线、ATR 止损和趋势分。
    - name: aStockTrendSystem
      type: connector
      purpose: 读取趋势系统总览。
    - name: aStockTrendStateHistory
      type: connector
      purpose: 读取趋势状态历史。
    - name: aStockTrendStrategyStats
      type: connector
      purpose: 读取趋势策略统计和样本表现。
    - name: quantTradePlanList
      type: connector
      purpose: 读取硬性交易计划表、执行状态和阻塞原因。
    - name: quantTradePlanUpsert
      type: connector
      purpose: 写入今日、下个交易日或明确日期的交易计划。
    - name: quantTradePlanReview
      type: connector
      purpose: 更新计划是否执行、未执行原因、成交委托和复盘结论。
    - name: aStockSignals
      type: connector
      purpose: 读取 A 股信号。
    - name: aStockMarketMood
      type: connector
      purpose: 读取市场情绪、涨跌停、行业热度等背景。
    - name: aStockNewsAndFilings
      type: connector
      purpose: 读取市场新闻、公告和持仓相关新闻。
    - name: tradingMemory
      type: memory
      query: 操盘交易员 规则 失败 触发价 止损 学习
    - name: workshopEvents
      type: channel
      filter: today pre-market intraday post-market order proposal memory data-quality

  loops:
    - name: pre-market-plan
      title: 盘前交易计划
      description: 交易日 09:05 读取账户、自选股和趋势状态，生成当天可验证的交易触发计划。
      skill: paper-trading-pre-market-plan
      status: active
      trigger:
        type: cron
        expression: "5 9 * * 1-5"
        timezone: Asia/Shanghai
        tradingCalendar: a-share
        tradingDayOnly: true
      goal: |
        每个 A 股交易日盘前建立可执行观察计划。
        必须读取模拟盘账户、自选股、趋势状态、市场情绪和必要新闻。
        输出弱持仓处理条件、候选替换观察、可下单触发价、计划数量、止损/失效条件。
        盘前不提交新增模拟买入；只形成盘中可验证计划和 blocker。
      context:
        sources:
          - type: connector
            name: quantPaperGetAccount
          - type: connector
            name: quantPaperGetWatchlist
          - type: connector
            name: quantTradePlanList
          - type: connector
            name: aStockTrendSystem
          - type: connector
            name: aStockMarketMood
          - type: memory
            name: tradingMemory
            query: 操盘交易员 规则 失败 触发价 止损 学习
        instructions: |
          形成当天盘中验证表：每个重点标的都要有触发价/失效价/计划动作/不交易 blocker。不要只写泛泛观察。
      actionPolicy:
        allowed:
          - quantPaperGetAccount
          - quantPaperGetWatchlist
          - quantTradePlanList
          - quantTradePlanUpsert
          - quantTradePlanReview
          - quantRuleEvaluate
          - aStockTrendStateHistory
          - aStockTrendSystem
          - aStockTrendStrategyStats
          - aStockQuote
          - aStockSignals
          - aStockMarketMood
          - aStockNewsAndFilings
          - workshopReadMemory
          - workshopSearchMemory
          - workshopRecordMemoryRecallFeedback
          - workshopGetMemoryEvidence
          - workshopReadLinkedWorkshopEvents
          - workshopLogEvent
          - workshopWriteMemory
        requiresApproval: []
        denied:
          - quantPaperPlaceOrder
          - quantPaperCancelOrder
          - quantMarketDiscoverCandidates
          - quantPaperProposeWatchlistChange
      verification:
        type: structured_check
        requiredFields:
          - accountState
          - watchlistState
          - tradeTriggers
          - tradePlanLedger
          - riskBlockers
          - nextControlAction
        requiredSources:
          - quantPaperGetAccount
          - quantPaperGetWatchlist
          - quantTradePlanList
          - aStockTrendSystem
          - quantRuleEvaluate
        successCriteria:
          - 读取当前账户和自选股行情
          - 为盘中交易给出具体触发价、计划数量和失效条件
          - 不在盘前提交新增买入委托
      approvalPolicy:
        defaultMode: allow
        externalWrites: deny
      retryPolicy:
        maxAttempts: 2
        onFailure: summarize_and_block
      escalationPolicy:
        onBlocked: notify_user
        onNeedsApproval: notify_user

    - name: intraday-learning-trade-check
      title: 盘中学习型模拟交易巡检
      description: 交易日 10:20、11:20、13:20 和 14:20 做模拟盘巡检；满足边界时提交进攻型模拟实验单，否则记录可学习 blocker。
      skill: paper-trading-intraday-check
      status: active
      trigger:
        type: cron
        expression: "20 10,11,13,14 * * 1-5"
        timezone: Asia/Shanghai
        tradingCalendar: a-share
        tradingDayOnly: true
      goal: |
        在交易中学习：每个交易日盘中至少完成一次可执行交易判断，并在条件满足时优先形成 1-3 笔模拟动作。
        先处理弱持仓，再比较自选股内更强替代标的；弱持仓满足止损、趋势破坏、相对强度落后或资金/新闻恶化时，优先减仓/退出并轮动。
        如果卖出、减仓、买入或替换条件满足，必须调用 quantPaperPlaceOrder 提交内部模拟限价委托。
        如果不下单，必须记录精确 blocker：数据、价格偏离、趋势、仓位、T+1、现金、涨跌停、风险收益比或市场状态。
        进攻型实验优先，通常 8%-15% 初始资金，单一标的原则上不超过 18%；所有买入必须带 plannedPrice、maxBuyDeviationPct=3 和 tradeThesis。
      context:
        sources:
          - type: connector
            name: quantPaperGetAccount
          - type: connector
            name: quantPaperGetWatchlist
          - type: connector
            name: quantTradePlanList
          - type: connector
            name: aStockTrendStateHistory
          - type: connector
            name: aStockTrendSystem
          - type: connector
            name: aStockTrendStrategyStats
          - type: connector
            name: aStockSignals
          - type: connector
            name: aStockNewsAndFilings
        instructions: |
          必须先读取账户和自选股，再读取趋势系统。
          把结论落到 actionTaken：order_submitted / hold_with_blocker / reduce_submitted / cancel_submitted。
          不要为了显得谨慎而只观察；模拟盘目标是用更高频的受控实验产生反馈。若持仓弱于自选股内替代标的，优先给出 reduce/exit + enter 的轮动决策。
      actionPolicy:
        allowed:
          - quantPaperGetAccount
          - quantPaperGetWatchlist
          - quantTradePlanList
          - quantTradePlanUpsert
          - quantTradePlanReview
          - quantRuleEvaluate
          - quantPaperPlaceOrder
          - quantPaperCancelOrder
          - aStockTrendStateHistory
          - aStockTrendSystem
          - aStockTrendStrategyStats
          - aStockQuote
          - aStockSignals
          - aStockMarketMood
          - aStockNewsAndFilings
          - workshopReadMemory
          - workshopSearchMemory
          - workshopRecordMemoryRecallFeedback
          - workshopGetMemoryEvidence
          - workshopReadLinkedWorkshopEvents
          - workshopLogEvent
          - workshopWriteMemory
        requiresApproval: []
        denied:
          - quantMarketDiscoverCandidates
          - quantPaperProposeWatchlistChange
      verification:
        type: structured_check
        requiredFields:
          - accountState
          - trendStateReview
          - rotationDecision
          - trendFollowDecision
          - tradePlanLedger
          - actionTaken
          - riskAssessment
          - learningFeedback
        requiredSources:
          - quantPaperGetAccount
          - quantPaperGetWatchlist
          - quantTradePlanList
          - aStockTrendSystem
          - quantRuleEvaluate
        successCriteria:
          - 若交易条件满足，同轮调用 quantPaperPlaceOrder 或 quantPaperCancelOrder，目标每个交易日形成 1-3 笔可复盘模拟动作
          - 若未交易，actionTaken 必须列出具体 blocker，不允许只有笼统观望
          - 弱持仓优先及时止损、减仓或轮动；rotationDecision 不能只写 hold，必须比较至少一个弱持仓和一个更强自选股候选
          - trendFollowDecision.candidateDecisions 必须把趋势信号落到 order_submitted、hold/tighten_stop、reduce/exit 或 blocked，并给出 orderId 或 blockedReason
          - break_warning/reduce_watch 必须说明盈利状态、T+1 可卖数量、止盈/失效线、处理动作和下次验证条件
          - 买入必须包含 plannedPrice、maxBuyDeviationPct 和 tradeThesis
          - tradePlanLedger must record every due plan as executed, blocked, skipped, or still pending with ruleEvidence when numeric rules are involved
          - 只交易当前自选股，且只操作内部模拟盘
      approvalPolicy:
        defaultMode: allow
        externalWrites: deny
      retryPolicy:
        maxAttempts: 2
        onFailure: summarize_and_block
      escalationPolicy:
        onBlocked: notify_user
        onNeedsApproval: notify_user

    - name: post-market-review
      title: 盘后交易复盘
      description: 交易日 15:45 复盘订单、成交、错过的动作和策略样本，沉淀下一轮学习。
      skill: paper-trading-post-market-review
      status: active
      trigger:
        type: cron
        expression: "45 15 * * 1-5"
        timezone: Asia/Shanghai
        tradingCalendar: a-share
        tradingDayOnly: true
      goal: |
        盘后复盘模拟盘订单、成交、持仓表现、未交易 blocker 和盘中学习样本。
        必须读取账户、成交、趋势策略统计和自选股状态。
        输出今天学到了什么、哪些规则过严/过松、明天要验证什么。
        盘后不新增买入，必要时只记录次日触发计划。
      context:
        sources:
          - type: connector
            name: quantPaperGetAccount
          - type: connector
            name: quantPaperGetWatchlist
          - type: connector
            name: quantTradePlanList
          - type: connector
            name: aStockTrendSystem
          - type: connector
            name: aStockTrendStrategyStats
          - type: memory
            name: tradingMemory
            query: 操盘交易员 成交 blocker 复盘 学习 策略样本
        instructions: |
          复盘必须把没有交易的原因也当成样本，写入 learningFeedback 或 workshop memory。
      actionPolicy:
        allowed:
          - quantPaperGetAccount
          - quantPaperGetWatchlist
          - quantTradePlanList
          - quantTradePlanUpsert
          - quantTradePlanReview
          - quantRuleEvaluate
          - aStockTrendStateHistory
          - aStockTrendSystem
          - aStockTrendStrategyStats
          - aStockQuote
          - aStockSignals
          - aStockMarketMood
          - aStockNewsAndFilings
          - workshopReadMemory
          - workshopSearchMemory
          - workshopRecordMemoryRecallFeedback
          - workshopGetMemoryEvidence
          - workshopReadLinkedWorkshopEvents
          - workshopLogEvent
          - workshopWriteMemory
        requiresApproval: []
        denied:
          - quantPaperPlaceOrder
          - quantMarketDiscoverCandidates
          - quantPaperProposeWatchlistChange
      verification:
        type: structured_check
        requiredFields:
          - accountState
          - orderReview
          - missedTradeReview
          - tradePlanLedger
          - strategyLearning
          - nextDayControlPlan
        requiredSources:
          - quantPaperGetAccount
          - quantTradePlanList
          - aStockTrendStrategyStats
          - quantRuleEvaluate
        successCriteria:
          - 复盘订单、成交和未交易 blocker
          - 沉淀至少一条可复用学习或明确说明无新学习
          - 形成次日可验证控制计划
      approvalPolicy:
        defaultMode: allow
        externalWrites: deny
      retryPolicy:
        maxAttempts: 2
        onFailure: summarize_and_block
      escalationPolicy:
        onBlocked: notify_user
        onNeedsApproval: notify_user

    - name: evening-news-research-review
      title: 晚间新闻投研复盘
      description: 交易日晚间读取市场新闻、公告、情绪和模拟盘状态，校验持仓假设，形成次日交易控制计划。
      skill: paper-trading-post-market-review
      status: active
      trigger:
        type: cron
        expression: "30 20 * * 1-5"
        timezone: Asia/Shanghai
        tradingCalendar: a-share
        tradingDayOnly: true
      goal: |
        每个 A 股交易日 20:30 完成晚间新闻投研复盘。
        任务目标不是追逐新闻热点，而是把新闻、公告、市场情绪作为扰动输入，校验模拟盘持仓和未成交委托是否仍然符合交易假设，并形成次日可执行的控制计划。
        必须读取模拟盘账户、持仓、成交、未成交委托、当前自选股、当天盘前/盘中/收盘工作记录、车间记忆、市场情绪、持仓与重点自选股相关新闻公告。
        输出必须区分：事实观测、新闻/公告影响、风险状态、次日计划、需要继续观察的触发条件。
        夜间不直接新增买入成交，不连接真实券商；如未成交模拟委托已经明显失效，可以按规则取消模拟委托并记录原因。新增买入只能写成次日待验证计划。
        只消费当前自选股和持仓，不负责扩大或维护自选股池；需要新增/移除自选股时，把原因记录给自选股猎手而不是自己改池。
        所有结论必须暴露数据源质量；如果行情、资金流、新闻源发生 fallback/sourceSwitch 但返回内容完整，只显式写 provider、detail、warning，不因此降低动作强度。
        只有返回样本、不可用、空结果、过期结果或缺少价格/成交额/趋势/资金流/新闻时间等任务必要字段时，才把数据质量作为降级或阻塞原因。
        每次运行必须用 workshopLogEvent 记录 marketNewsSummary、positionNewsReview、orderRiskReview、nextDayControlPlan 四个字段事件，便于验证器识别和后续复盘。
        需要沉淀为经验的规则、失败案例、数据源异常，用 workshopWriteMemory 写入车间记忆。
      context:
        sources:
          - type: connector
            name: quantPaperGetAccount
            metadata:
              purpose: 读取模拟盘账户、持仓、成交和未成交委托。
          - type: connector
            name: quantPaperGetWatchlist
            metadata:
              purpose: 读取当前自选股，不主动扩池。
          - type: connector
            name: quantTradePlanList
            metadata:
              purpose: 读取硬性交易计划表、执行状态和阻塞原因。
          - type: connector
            name: aStockQuote
            metadata:
              purpose: 读取持仓和重点自选股收盘行情。
          - type: connector
            name: aStockTrend
            metadata:
              purpose: 读取持仓和重点自选股的日线趋势结构、均线、ATR 止损和趋势分。
          - type: connector
            name: aStockMarketMood
            metadata:
              purpose: 读取市场情绪、涨跌停、行业热度等背景。
          - type: connector
            name: aStockNewsAndFilings
            metadata:
              purpose: 读取市场新闻、公告和持仓相关新闻。
          - type: memory
            name: workshopMemory
            query: 操盘交易员 风险规则 数据源异常 交易复盘 失败案例
          - type: channel
            name: workshopEvents
            filter: today pre-market intraday post-market order proposal memory data-quality
        instructions: |
          先读取 currentTime.localDateWithWeekday，报告日期和星期必须以系统注入时间为准。
          先复核模拟盘账户、持仓、成交、未成交委托，再读取行情和市场情绪，最后读取新闻公告。
          对持仓和重点自选股必须读取 aStockTrend，把趋势状态、趋势分、均线结构和ATR止损作为次日计划依据。
          新闻只作为参考输入，不能覆盖价格、仓位、资金流、数据质量和既有交易纪律。
          对每个持仓给出保留、减仓观察、止损观察、取消未成交委托等控制建议，并说明触发条件。
          不调用自选股发现和自选股修改工具；发现池子问题时写事件交给自选股猎手。
          不在夜间使用 quantPaperPlaceOrder；如取消模拟委托，必须说明委托失效依据。
      actionPolicy:
        allowed:
          - quantPaperGetAccount
          - quantPaperGetWatchlist
          - quantTradePlanList
          - quantTradePlanUpsert
          - quantTradePlanReview
          - quantRuleEvaluate
          - quantPaperCancelOrder
          - aStockQuote
          - aStockResearch
          - aStockSignals
          - aStockTrend
          - aStockFundamentals
          - aStockNewsAndFilings
          - aStockMarketMood
          - workshopReadMemory
          - workshopSearchMemory
          - workshopRecordMemoryRecallFeedback
          - workshopGetMemoryEvidence
          - workshopReadLinkedWorkshopEvents
          - workshopLogEvent
          - workshopWriteMemory
        requiresApproval: []
        denied:
          - quantPaperPlaceOrder
          - quantMarketDiscoverCandidates
          - quantPaperProposeWatchlistChange
          - realBrokerOrder
          - externalPayment
          - wechatSendMessage
          - outboxSend
          - douyinPublishApprovedDraft
      verification:
        type: structured_check
        requiredFields:
          - marketNewsSummary
          - positionNewsReview
          - orderRiskReview
          - tradePlanLedger
          - nextDayControlPlan
        requiredSources:
          - quantPaperGetAccount
          - quantPaperGetWatchlist
          - quantTradePlanList
          - aStockTrend
          - quantRuleEvaluate
          - aStockMarketMood
          - aStockNewsAndFilings
        successCriteria:
          - 报告日期和星期使用 currentTime.localDateWithWeekday，不自行猜测。
          - 完成账户、持仓、成交、未成交委托和自选股的闭环复核。
          - 至少检查持仓和重点自选股相关新闻公告，并说明其对交易假设的影响。
          - 把新闻结论降级为参考输入，不用单条新闻直接触发买入。
          - 夜间不调用 quantPaperPlaceOrder，不主动维护自选股池。
          - 输出次日计划时必须包含触发条件、仓位影响、风险边界和数据质量说明。
          - 明确记录 marketNewsSummary、positionNewsReview、orderRiskReview、nextDayControlPlan 四个字段事件。
      approvalPolicy:
        defaultMode: allow
        externalWrites: deny
      retryPolicy:
        maxAttempts: 2
        onFailure: summarize_and_block
      escalationPolicy:
        onBlocked: notify_user
        onNeedsApproval: notify_user

  creationReport:
    title: 操盘交易员车间声明
    body: |
      创建一个内部模拟盘操盘交易员车间。
      被控对象是内部 paper-trading simulator 的账户、持仓、委托和复盘样本。
      观测输入包括模拟盘账户、自选股、行情、趋势状态、策略统计、市场情绪、新闻公告、车间记忆和关联车间事件。
      控制动作包括读取模拟盘、读取行情、写入车间事件、写入车间记忆、提交内部模拟限价单和取消内部模拟委托。
      禁止真实交易、真实资金划转、真实券商连接、对外发送交易指令、维护自选股池、调用候选发现工具。
      已配置盘前交易计划、盘中学习型模拟交易巡检、盘后交易复盘、晚间新闻投研复盘四个 Loop。
      每轮输出必须暴露账户状态、趋势判断、动作或 blocker、风险评估、学习反馈和数据源质量。
    requiredEvents:
      - 车间已创建
      - 操盘交易员学习型模拟交易闭环已配置
    requiredFields:
      - accountState
      - watchlistState
      - actionTaken
      - riskAssessment
      - learningFeedback
      - nextDayControlPlan

  applyPolicy:
    idempotency:
      key: metadata.name
      loopKey: loops.name
      behavior: upsert
    dryRunSupported: true
    diffSupported: true
    versionSnapshot: true
    auditEvent: true
